services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      ACTIVE_STORAGE_SERVICE: local
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-2222}
      PAYJP_PUBLIC_KEY: ${PAYJP_PUBLIC_KEY:-}
      PAYJP_SECRET_KEY: ${PAYJP_SECRET_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    init: true

volumes:
  mysql_data:
  bundle_data:
